### 示例

```yaml
# /api/users
GET /api/users:
  description: 获取用户列表
  params:
    page: int (optional, 默认 1)
    size: int (optional, 默认 20)
  response: { users: [{ id, name, email }], total: int }

POST /api/users:
  description: 创建用户
  body: { name: str, email: str, password: str }
  response: { id, name, email }
  errors:
    409: 邮箱已存在
```

