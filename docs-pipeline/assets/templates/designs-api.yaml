# API 设计现状
#
# 本文件描述系统当前的 API 设计，使用 OpenAPI 3.0 格式。
#
# 重要：每次新增或修改 API 后，必须更新本文件。
#
# 同步检查：
# - 新增 API → 在 paths 中添加对应路径
# - 修改 API → 更新对应路径的定义
# - 删除 API → 从 paths 中移除对应路径

openapi: 3.0.0
info:
  title: API Design
  version: 1.0.0
  description: |
    系统 API 设计现状。

    ## 同步规则

    每次代码变更后，检查本文件是否需要更新：
    - 新增/修改 API → 更新 paths
    - 新增/修改 DTO → 更新 components/schemas
    - 新增/修改错误码 → 更新 components/responses

servers:
  - url: http://localhost:8080
    description: 本地开发环境

paths:
  # 示例：用户 API
  # /users:
  #   get:
  #     summary: 查询用户列表
